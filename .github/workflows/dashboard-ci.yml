name: dashboard-ci

on:
  push:
    branches: ["**"]
    paths: ["claude-os-dashboard/**", ".github/workflows/dashboard-ci.yml"]
  pull_request:
    paths: ["claude-os-dashboard/**", ".github/workflows/dashboard-ci.yml"]

defaults:
  run:
    working-directory: claude-os-dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: claude-os-dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
